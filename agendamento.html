<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato de Farmar Aura - Agendamento</title>
</head>

<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="Index.html">Inicio</a>
            <a href="agendamento.html">Agendamento</a>
            <a href="Download.html">Download</a>
        </nav>
    </header>

    <main>
        <h2>Faça sua Inscrição</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone" required inputmode="numeric" maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321">
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" required>
            <br>
            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora" required>
            <br>
            <label for="Periodo">Periodo que vai participar:</label>
            <select name="Periodo" id="Periodo" required>
                <option value="">Selecione uma opção</option>
                <option value="Manha">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
            </select>
            <br>
            <label for="mensagem">Mensegem:</label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit">Confirmar inscrição</button>
        </form>
    </main>

    <footer>
        <p>
            Entre em contato conosco - (17) 12345-6789 ou farmar.aura@gmail.com
        </p>
    </footer>
</body>

</html>
